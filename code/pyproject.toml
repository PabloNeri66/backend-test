[project]
name = "investiments-api"
version = "1.0"
description = "API de investimentos"
requires-python = ">=3.11"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations', 'manage.py', '.env']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = 'ruff check'
lint_fix = 'ruff check --fix'
format = 'ruff format'
docs = 'mkdocs serve -a 127.0.0.1:8001'